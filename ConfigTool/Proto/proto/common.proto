syntax = "proto3";
option csharp_namespace = "TowerDefense.Proto";
option go_package = "towerdefense/proto";

// ========== 消息类型枚举 ==========
// 对应客户端的 Cmd 枚举

enum MessageType {
  MSG_NONE = 0;
  
  // 连接相关 1000-1099
  MSG_HEARTBEAT = 1000;
  MSG_LOGIN = 1001;
  MSG_LOGOUT = 1002;
  
  // 房间相关 2000-2099
  MSG_CREATE_ROOM = 2001;
  MSG_JOIN_ROOM = 2002;
  MSG_LEAVE_ROOM = 2003;
  MSG_ROOM_INFO = 2004;
  MSG_START_GAME = 2005;
  
  // 战斗相关 3000-3099
  MSG_PLACE_TOWER = 3001;
  MSG_UPGRADE_TOWER = 3002;
  MSG_SELL_TOWER = 3003;
  MSG_WAVE_START = 3004;
  MSG_WAVE_COMPLETE = 3005;
  MSG_GAME_OVER = 3006;
  
  // 同步相关 4000-4099
  MSG_SYNC_STATE = 4001;
  MSG_SYNC_ENEMY = 4002;
  MSG_SYNC_TOWER = 4003;
  MSG_SYNC_DAMAGE = 4004;
  
  // 错误消息 9999
  MSG_ERROR = 9999;
}

// ========== 基础类型 ==========

// 三维向量
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// ========== 通用消息包装 ==========

// 网络消息包装器 - 用于 WebSocket 传输
message NetworkPacket {
  int32 cmd = 1;              // 对应 Cmd 枚举值
  int32 code = 2;             // 错误码，0表示成功
  bytes payload = 3;          // 序列化后的具体消息内容
  int64 timestamp = 4;        // 时间戳
  string message_id = 5;      // 消息ID，用于追踪
}

// ========== 错误消息 ==========

// 错误响应
message ErrorResponse {
  int32 code = 1;
  string message = 2;
  string detail = 3;         // 详细错误信息
}

// 错误码定义
enum ErrorCode {
  ERROR_NONE = 0;
  
  // 通用错误 1000-1999
  ERROR_UNKNOWN = 1000;
  ERROR_INVALID_PARAM = 1001;
  ERROR_PERMISSION_DENIED = 1002;
  ERROR_NOT_FOUND = 1003;
  ERROR_ALREADY_EXISTS = 1004;
  ERROR_TIMEOUT = 1005;
  
  // 连接错误 2000-2099
  ERROR_NOT_LOGIN = 2000;
  ERROR_LOGIN_FAILED = 2001;
  ERROR_TOKEN_INVALID = 2002;
  ERROR_ALREADY_LOGIN = 2003;
  
  // 房间错误 3000-3099
  ERROR_ROOM_FULL = 3000;
  ERROR_ROOM_NOT_FOUND = 3001;
  ERROR_NOT_IN_ROOM = 3002;
  ERROR_NOT_HOST = 3003;
  ERROR_ROOM_ALREADY_STARTED = 3004;
  
  // 战斗错误 4000-4099
  ERROR_NOT_ENOUGH_GOLD = 4000;
  ERROR_INVALID_POSITION = 4001;
  ERROR_TOWER_NOT_FOUND = 4002;
  ERROR_GAME_NOT_STARTED = 4003;
  ERROR_GAME_OVER = 4004;
}
