syntax = "proto3";

package towerdefense;
option csharp_namespace = "TowerDefense.Proto";
option go_package = "towerdefense/proto";

import "common.proto";

// ========== 同步相关消息 ==========

// 敌人状态
message EnemyState {
  string enemy_id = 1;
  int32 type = 2;
  int32 hp = 3;
  int32 max_hp = 4;
  Vector3 position = 5;
  float speed = 6;
  int32 path_index = 7;       // 路径点索引
  float path_progress = 8;    // 路径进度 0-1
  repeated int32 buffs = 9;   // Buff列表
  repeated int32 debuffs = 10; // Debuff列表
}

// 防御塔状态
message TowerState {
  string tower_id = 1;
  int32 type = 2;
  int32 level = 3;
  Vector3 position = 4;
  string target_id = 5;       // 当前目标ID
  float attack_cooldown = 6;  // 攻击冷却剩余时间
  int32 total_damage = 7;     // 累计伤害
  int32 kill_count = 8;       // 击杀数
  string owner_id = 9;        // 所属玩家ID
}

// 状态同步广播
message SyncStateBroadcast {
  int32 gold = 1;
  int32 life = 2;
  int32 wave_num = 3;
  repeated EnemyState enemies = 4;
  repeated TowerState towers = 5;
  float game_time = 6;        // 游戏时间
  int32 current_wave_kills = 7; // 当前波击杀数
}

// 敌人同步广播
message SyncEnemyBroadcast {
  repeated EnemyState enemies = 1;
  repeated string removed_enemy_ids = 2; // 已移除的敌人ID列表
}

// 防御塔同步广播
message SyncTowerBroadcast {
  repeated TowerState towers = 1;
  repeated string removed_tower_ids = 2; // 已移除的塔ID列表
}

// 伤害同步广播
message SyncDamageBroadcast {
  string tower_id = 1;
  string enemy_id = 2;
  int32 damage = 3;
  bool is_crit = 4;
  bool is_kill = 5;
  Vector3 position = 6;       // 伤害位置
  int32 damage_type = 7;      // 伤害类型: 1=物理 2=魔法 3=真实
  repeated int32 effects = 8; // 伤害特效列表
}

// 敌人生成通知
message EnemySpawnNotify {
  EnemyState enemy = 1;
  int32 wave_num = 2;
}

// 敌人死亡通知
message EnemyDeathNotify {
  string enemy_id = 1;
  string killer_tower_id = 2;
  string killer_player_id = 3;
  int32 reward_gold = 4;
  Vector3 death_position = 5;
}

// 防御塔攻击通知
message TowerAttackNotify {
  string tower_id = 1;
  string target_id = 2;
  Vector3 from_position = 3;
  Vector3 to_position = 4;
  int32 attack_type = 5;      // 攻击类型: 1=单体 2=AOE 3=链式
}

// 玩家状态同步
message PlayerStateSync {
  string player_id = 1;
  int32 gold = 2;
  int32 life = 3;
  int32 kill_count = 4;
  int64 total_damage = 5;
  int32 tower_count = 6;
  bool is_alive = 7;
}

// 游戏状态快照（用于断线重连）
message GameStateSnapshot {
  int32 wave_num = 1;
  float game_time = 2;
  repeated EnemyState enemies = 3;
  repeated TowerState towers = 4;
  repeated PlayerStateSync players = 5;
  string game_status = 6;     // running/paused/finished
  int64 snapshot_time = 7;
}

// 请求游戏状态
message RequestGameStateRequest {
  // 空请求
}

// 游戏状态响应
message RequestGameStateResponse {
  bool success = 1;
  GameStateSnapshot snapshot = 2;
  string message = 3;
}

// Buff/Debuff 状态
message BuffState {
  int32 buff_id = 1;
  string target_id = 2;       // 目标ID（敌人或塔）
  int32 duration = 3;         // 持续时间(ms)
  int32 stack_count = 4;      // 叠加层数
  string source_id = 5;       // 来源ID
}

// Buff同步通知
message BuffSyncNotify {
  repeated BuffState buffs = 1;
  repeated string removed_buff_ids = 2;
}
