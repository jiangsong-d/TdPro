syntax = "proto3";

package towerdefense;
option csharp_namespace = "TowerDefense.Proto";
option go_package = "towerdefense/proto";

// ========== 基础消息包装 ==========

// 消息类型枚举
enum MessageType {
  MSG_NONE = 0;
  
  // 连接相关 1000-1099
  MSG_HEARTBEAT = 1000;
  MSG_LOGIN = 1001;
  MSG_LOGOUT = 1002;
  
  // 房间相关 2000-2099
  MSG_CREATE_ROOM = 2001;
  MSG_JOIN_ROOM = 2002;
  MSG_LEAVE_ROOM = 2003;
  MSG_ROOM_INFO = 2004;
  MSG_START_GAME = 2005;
  
  // 战斗相关 3000-3099
  MSG_PLACE_TOWER = 3001;
  MSG_UPGRADE_TOWER = 3002;
  MSG_SELL_TOWER = 3003;
  MSG_WAVE_START = 3004;
  MSG_WAVE_COMPLETE = 3005;
  MSG_GAME_OVER = 3006;
  
  // 同步相关 4000-4099
  MSG_SYNC_STATE = 4001;
  MSG_SYNC_ENEMY = 4002;
  MSG_SYNC_TOWER = 4003;
  MSG_SYNC_DAMAGE = 4004;
  
  // 错误消息 9999
  MSG_ERROR = 9999;
}

// 消息包装器
message GameMessage {
  MessageType type = 1;
  bytes payload = 2;
}

// ========== 连接相关消息 ==========

// 心跳请求
message HeartbeatRequest {
  int64 timestamp = 1;
}

// 心跳响应
message HeartbeatResponse {
  int64 timestamp = 1;
}

// 登录请求
message LoginRequest {
  string player_id = 1;
  string player_name = 2;
  string token = 3;
}

// 登录响应
message LoginResponse {
  bool success = 1;
  string player_id = 2;
  string message = 3;
}

// ========== 房间相关消息 ==========

// 创建房间请求
message CreateRoomRequest {
  string room_name = 1;
  int32 max_player = 2;
  int32 level_id = 3;
}

// 创建房间响应
message CreateRoomResponse {
  bool success = 1;
  string room_id = 2;
  string message = 3;
}

// 加入房间请求
message JoinRoomRequest {
  string room_id = 1;
}

// 加入房间响应
message JoinRoomResponse {
  bool success = 1;
  string room_id = 2;
  repeated PlayerInfo players = 3;
  string message = 4;
}

// 玩家信息
message PlayerInfo {
  string player_id = 1;
  string player_name = 2;
  bool is_ready = 3;
  bool is_host = 4;
}

// 房间信息广播
message RoomInfoBroadcast {
  string room_id = 1;
  repeated PlayerInfo players = 2;
  string status = 3; // waiting, playing, finished
}

// 开始游戏请求
message StartGameRequest {
  string room_id = 1;
}

// 波次信息
message WaveInfo {
  int32 wave_num = 1;
  repeated int32 enemy_types = 2;
  repeated int32 enemy_counts = 3;
  int32 reward = 4;
}

// 游戏初始化数据
message GameInitData {
  int32 gold = 1;
  int32 life = 2;
  string map_data = 3;
  repeated WaveInfo wave_info = 4;
}

// 开始游戏响应
message StartGameResponse {
  bool success = 1;
  int32 level_id = 2;
  GameInitData game_data = 3;
  string message = 4;
}

// ========== 战斗相关消息 ==========

// 三维向量
message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 放置防御塔请求
message PlaceTowerRequest {
  int32 tower_type = 1;
  Vector3 position = 2;
}

// 放置防御塔响应
message PlaceTowerResponse {
  bool success = 1;
  string tower_id = 2;
  int32 gold = 3;
  string message = 4;
}

// 升级防御塔请求
message UpgradeTowerRequest {
  string tower_id = 1;
}

// 升级防御塔响应
message UpgradeTowerResponse {
  bool success = 1;
  string tower_id = 2;
  int32 level = 3;
  int32 gold = 4;
  string message = 5;
}

// 出售防御塔请求
message SellTowerRequest {
  string tower_id = 1;
}

// 出售防御塔响应
message SellTowerResponse {
  bool success = 1;
  string tower_id = 2;
  int32 gold = 3;
  string message = 4;
}

// 波次开始广播
message WaveStartBroadcast {
  int32 wave_num = 1;
}

// 波次完成广播
message WaveCompleteBroadcast {
  int32 wave_num = 1;
  int32 reward = 2;
}

// 游戏结束广播
message GameOverBroadcast {
  bool is_victory = 1;
  int32 total_waves = 2;
  int32 kill_count = 3;
  int64 total_damage = 4;
  int32 score = 5;
}

// ========== 同步相关消息 ==========

// 敌人状态
message EnemyState {
  string enemy_id = 1;
  int32 type = 2;
  int32 hp = 3;
  int32 max_hp = 4;
  Vector3 position = 5;
  float speed = 6;
}

// 防御塔状态
message TowerState {
  string tower_id = 1;
  int32 type = 2;
  int32 level = 3;
  Vector3 position = 4;
  string target_id = 5;
}

// 状态同步广播
message SyncStateBroadcast {
  int32 gold = 1;
  int32 life = 2;
  int32 wave_num = 3;
  repeated EnemyState enemies = 4;
  repeated TowerState towers = 5;
}

// 伤害同步广播
message SyncDamageBroadcast {
  string tower_id = 1;
  string enemy_id = 2;
  int32 damage = 3;
  bool is_crit = 4;
  bool is_kill = 5;
}

// ========== 错误消息 ==========

// 错误响应
message ErrorResponse {
  int32 code = 1;
  string message = 2;
}
